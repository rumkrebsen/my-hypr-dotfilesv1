[config]

[config.custom_colors]
red     = { color = "#ff5555", blend = true }
green   = { color = "#50fa7b", blend = true }
yellow  = { color = "#f1fa8c", blend = true }
blue    = { color = "#6d8dff", blend = true }
magenta = { color = "#ff79c6", blend = true }
cyan    = { color = "#8be9fd", blend = true }

[templates.kitty]
input_path  = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.config/kitty/matugen-colors.conf'
post_hook   = 'pkill -USR1 kitty'

[templates.waybar]
input_path  = '~/.config/matugen/templates/waybar-colors.css'
output_path = '~/.config/waybar/matugen-colors.css'
post_hook   = 'pkill -SIGUSR2 waybar'
